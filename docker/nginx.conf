server {
	listen 80 default_server;
	server_name _;

	root /usr/share/racktables/wwwroot;
	index index.php;

	client_max_body_size 32m;

	access_log /dev/stdout;
	error_log /dev/stderr warn;

	# RackTables keeps its includes here, they are never requested directly.
	location ^~ /inc/ {
		deny all;
	}

	location ~ /\. {
		deny all;
	}

	location / {
		try_files $uri $uri/ =404;
	}

	location ~ \.php$ {
		try_files $uri =404;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		# The database authentication method reads PHP_AUTH_USER, which PHP
		# only sees when the header reaches fastcgi.
		fastcgi_param HTTP_AUTHORIZATION $http_authorization;
		fastcgi_pass 127.0.0.1:9000;
	}
}
