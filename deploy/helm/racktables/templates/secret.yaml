{{- if not .Values.externalDatabase.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "racktables.databaseSecretName" . }}
  labels:
    {{- include "racktables.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.externalDatabase.passwordKey }}: {{ required "externalDatabase.password is required unless externalDatabase.existingSecret is set" .Values.externalDatabase.password | quote }}
{{- end }}
{{- if and (not .Values.admin.existingSecret) .Values.admin.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "racktables.adminSecretName" . }}
  labels:
    {{- include "racktables.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.admin.passwordKey }}: {{ .Values.admin.password | quote }}
{{- end }}
