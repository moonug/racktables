apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "racktables.fullname" . }}
  labels:
    {{- include "racktables.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "racktables.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/database-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "racktables.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "racktables.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: racktables
          image: {{ include "racktables.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- include "racktables.env" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz.php
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "racktables.secretVolumeMounts" . | nindent 12 }}
            - name: runtime
              mountPath: /run/racktables
            - name: tmp
              mountPath: /var/tmp
            - name: sessions
              mountPath: /var/lib/php/sessions
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        {{- include "racktables.secretVolumes" . | nindent 8 }}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: sessions
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
