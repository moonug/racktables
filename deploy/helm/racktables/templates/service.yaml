apiVersion: v1
kind: Service
metadata:
  name: {{ include "racktables.fullname" . }}
  labels:
    {{- include "racktables.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector:
    {{- include "racktables.selectorLabels" . | nindent 4 }}
