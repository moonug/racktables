name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3']
    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ''
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Install base packages
        working-directory: /
        run: apt-get update && apt-get install -y git ca-certificates curl mariadb-client
      - uses: actions/checkout@v4
      - name: Fix git ownership
        run: git config --global --add safe.directory '*'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, mysqli, pdo_mysql, snmp, bcmath, json, dom, xmlwriter, tokenizer
          tools: phpunit:9.6
      - name: Create test database and secret.php
        env:
          RT_DB_HOST: mysql
        run: tests/ci_setup_mysql.sh racktables_unittest racktables_unittest racktables_unittest
      - name: Run tests
        run: tests/express_phpunit.sh
      - name: Remove deployment config
        if: always()
        run: rm -f wwwroot/inc/secret.php

  debian:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install base packages
        working-directory: /
        run: apt-get update && apt-get install -y git ca-certificates curl
      - uses: actions/checkout@v4
      - name: Fix git ownership
        run: git config --global --add safe.directory '*'
      - name: Install packaging tools
        run: apt-get install -y --no-install-recommends build-essential dpkg-dev debhelper
      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Inspect the package
        run: |
          deb=$(ls -1 ../racktables_*.deb | head -1)
          echo "Built: $deb"
          dpkg-deb -c "$deb" | grep -E 'auth-methods/(common|ldap|saml)\.php' || { echo "auth-methods missing"; exit 1; }
          dpkg-deb -c "$deb" | grep -q 'usr/share/doc/racktables/copyright' || { echo "copyright file missing"; exit 1; }
          if dpkg-deb -c "$deb" | grep -E '(inc|auth-methods)/(secret|local)\.php'; then
            echo "ERROR: deployment config shipped in package"
            exit 1
          fi
          cp "$deb" ./racktables.deb
      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: racktables-deb
          path: racktables.deb
          if-no-files-found: error

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: docker compose config -q
      - name: Build and start the stack
        env:
          RT_DEMO_DATA: "1"
        run: docker compose up -d --build --wait
      - name: Check the running instance
        run: |
          curl -fsS http://127.0.0.1:8080/healthz.php
          curl -fsS -u admin:admin http://127.0.0.1:8080/index.php | grep -q 'ISA Net'
          curl -fsS -u ivanova:ivanova 'http://127.0.0.1:8080/index.php?page=object&tab=ports&object_id=100801' | grep -q 'Hu1/1/0'
          curl -fsS -u ivanova:ivanova 'http://127.0.0.1:8080/index.php?page=object&tab=ports&object_id=100593' | grep -qi 'access denied'
          curl -fsS -u gkar:gkar 'http://127.0.0.1:8080/index.php?page=object&tab=log&object_id=100628' | grep -q 'Commissioned'
          curl -fsS -u guest:guest 'http://127.0.0.1:8080/index.php?page=object&tab=ports&object_id=100437' | grep -qi 'access denied'
      - name: Show container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/racktables --set externalDatabase.password=secret
          helm template ci deploy/helm/racktables --set externalDatabase.password=secret > /dev/null
          helm template ci deploy/helm/racktables --set externalDatabase.existingSecret=db-secret \
            --set ingress.enabled=true --set cron.syncdomain.enabled=true > /dev/null
